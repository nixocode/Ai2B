<!doctype html><html><head><meta charset="utf-8"><title>Radii & shadows</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="wrap">
  <p class="label-mono" style="margin:0 0 12px">Radii · 8 · 10 btn · 14 card · 16 frame · 999 pill</p>
  <div style="display:flex;gap:10px;align-items:flex-end;margin-bottom:20px">
    <div style="width:56px;height:56px;background:var(--surface);border:1px solid var(--border);border-radius:8px"></div>
    <div style="width:56px;height:56px;background:var(--surface);border:1px solid var(--border);border-radius:10px"></div>
    <div style="width:56px;height:56px;background:var(--surface);border:1px solid var(--border);border-radius:14px"></div>
    <div style="width:56px;height:56px;background:var(--surface);border:1px solid var(--border);border-radius:16px"></div>
    <div style="width:56px;height:56px;background:var(--surface);border:1px solid var(--border);border-radius:999px"></div>
  </div>
  <p class="label-mono" style="margin:0 0 12px">Shadows · card drop · CTA glow · nav</p>
  <div style="display:flex;gap:16px">
    <div style="width:100px;height:64px;background:var(--surface);border:1px solid var(--border);border-radius:14px;box-shadow:0 20px 60px -30px rgba(0,0,0,.7),inset 0 0 0 1px rgba(255,255,255,.02)"></div>
    <div style="width:100px;height:40px;background:var(--accent);border-radius:10px;box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 6px 18px -6px rgba(255,90,31,.35)"></div>
    <div style="width:100px;height:40px;background:rgba(14,14,19,.55);border:1px solid var(--border);border-radius:999px;backdrop-filter:blur(14px);box-shadow:0 8px 24px -14px rgba(0,0,0,.6)"></div>
  </div>
</div></body></html>
