<!doctype html><html><head><meta charset="utf-8"><title>Buttons</title><link rel="stylesheet" href="_card.css">
<style>
.btn-primary{display:inline-flex;align-items:center;gap:.5rem;background:var(--accent);color:#fff;font-weight:500;padding:.8rem 1.4rem;border-radius:10px;border:none;cursor:pointer;font-size:.95rem;letter-spacing:-.005em;box-shadow:0 1px 0 rgba(255,255,255,.15) inset,0 6px 18px -6px var(--accent-glow);font-family:inherit}
.btn-ghost{display:inline-flex;align-items:center;gap:.5rem;background:transparent;color:var(--text);font-weight:500;padding:.8rem 1.4rem;border-radius:10px;border:1px solid var(--border-2);cursor:pointer;font-size:.95rem;font-family:inherit}
.nav-cta{display:inline-flex;align-items:center;gap:.35rem;padding:.5rem .9rem;font-size:13px;font-weight:500;color:#fff;background:var(--accent);border-radius:999px;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 6px 16px -6px var(--accent-glow)}
</style></head>
<body><div class="wrap">
  <p class="label-mono" style="margin:0 0 12px">Primary · ghost · nav CTA</p>
  <div style="display:flex;gap:12px;align-items:center;flex-wrap:wrap">
    <button class="btn-primary">See how it works ↗</button>
    <button class="btn-ghost">Book a call</button>
    <a class="nav-cta">Book a call ↗</a>
  </div>
  <p class="label-mono" style="margin:18px 0 8px">Hover · :hover translateY(-1px), accent-soft fill, deeper glow</p>
  <button class="btn-primary" style="background:#FF7A3F;transform:translateY(-1px);box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 12px 26px -8px rgba(255,90,31,.35)">Let's build it ↗</button>
</div></body></html>
