<!doctype html><html><head><meta charset="utf-8"><title>Nav</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="wrap">
  <p class="label-mono" style="margin:0 0 12px">Floating pill nav · blur 14px</p>
  <div style="background:rgba(14,14,19,.55);border:1px solid var(--border);backdrop-filter:blur(14px);box-shadow:0 8px 24px -14px rgba(0,0,0,.6);border-radius:999px;display:flex;align-items:center;gap:12px;padding:6px 6px 6px 16px">
    <div style="display:flex;align-items:center;gap:8px">
      <span style="width:22px;height:22px;border-radius:999px;background:radial-gradient(circle at 30% 30%,#FF8A55,#FF5A1F 60%,#C73E0F 100%);box-shadow:0 0 0 1px rgba(255,255,255,.1) inset,0 0 18px rgba(255,90,31,.45);position:relative">
        <span style="position:absolute;inset:0;margin:auto;width:4px;height:4px;border-radius:999px;background:#0a0a0f"></span>
      </span>
      <span style="font-size:15px;font-weight:500;letter-spacing:-0.022em">Ai2B</span>
    </div>
    <div style="display:flex;gap:2px;margin:0 auto">
      <span style="padding:.5rem .875rem;font-size:13.5px;font-weight:450;color:var(--muted);border-radius:999px">How</span>
      <span style="padding:.5rem .875rem;font-size:13.5px;font-weight:450;color:var(--text);background:rgba(255,255,255,.04);border-radius:999px">Industries</span>
      <span style="padding:.5rem .875rem;font-size:13.5px;font-weight:450;color:var(--muted);border-radius:999px">Why us</span>
      <span style="padding:.5rem .875rem;font-size:13.5px;font-weight:450;color:var(--muted);border-radius:999px">Contact</span>
    </div>
    <span style="display:inline-flex;align-items:center;gap:6px;padding:.5rem .9rem;font-size:13px;font-weight:500;color:#fff;background:var(--accent);border-radius:999px;box-shadow:0 1px 0 rgba(255,255,255,.18) inset,0 6px 16px -6px rgba(255,90,31,.35)">Book a call ↗</span>
  </div>
</div></body></html>
