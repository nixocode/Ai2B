<!doctype html><html><head><meta charset="utf-8"><title>Logo</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="wrap">
  <p class="label-mono" style="margin:0 0 18px">Nav mark · CSS radial-gradient circle with 4px hole</p>
  <div style="display:flex;gap:40px;align-items:center">
    <span style="width:22px;height:22px;border-radius:999px;background:radial-gradient(circle at 30% 30%,#FF8A55,#FF5A1F 60%,#C73E0F 100%);box-shadow:0 0 0 1px rgba(255,255,255,.1) inset,0 0 18px rgba(255,90,31,.45);position:relative">
      <span style="position:absolute;inset:0;margin:auto;width:4px;height:4px;border-radius:999px;background:#0a0a0f"></span>
    </span>
    <div style="display:flex;align-items:center;gap:10px">
      <span style="width:44px;height:44px;border-radius:999px;background:radial-gradient(circle at 30% 30%,#FF8A55,#FF5A1F 60%,#C73E0F 100%);box-shadow:0 0 0 1px rgba(255,255,255,.1) inset,0 0 24px rgba(255,90,31,.45);position:relative">
        <span style="position:absolute;inset:0;margin:auto;width:8px;height:8px;border-radius:999px;background:#0a0a0f"></span>
      </span>
      <span style="font-size:28px;font-weight:500;letter-spacing:-0.022em">Ai2B</span>
    </div>
  </div>
</div></body></html>
