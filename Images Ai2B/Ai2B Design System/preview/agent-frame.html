<!doctype html><html><head><meta charset="utf-8"><title>Agent frame</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="wrap">
  <p class="label-mono" style="margin:0 0 12px">AgentFrame · chrome header · ambient halo</p>
  <div style="position:relative;padding:20px">
    <div style="position:absolute;inset:-12px 0;background:radial-gradient(circle at 60% 40%,rgba(232,93,117,.12),transparent 60%);filter:blur(24px);pointer-events:none"></div>
    <div style="position:relative;background:linear-gradient(180deg,rgba(255,255,255,.025),rgba(255,255,255,0) 60%),var(--surface);border:1px solid var(--border);border-radius:16px;overflow:hidden;box-shadow:0 20px 60px -30px rgba(0,0,0,.7)">
      <div style="position:absolute;top:0;left:0;right:0;height:1px;background:linear-gradient(90deg,transparent,rgba(232,93,117,.5),transparent)"></div>
      <div style="display:flex;align-items:center;gap:8px;padding:10px 16px;border-bottom:1px solid var(--border)">
        <span style="width:8px;height:8px;border-radius:999px;background:#E85D75;box-shadow:0 0 10px #E85D75"></span>
        <span class="label-mono" style="letter-spacing:0.18em">SUPPORT_AGENT · live</span>
        <span style="margin-left:auto;display:flex;gap:4px"><span style="width:4px;height:4px;border-radius:999px;background:var(--border-2)"></span><span style="width:4px;height:4px;border-radius:999px;background:var(--border-2)"></span><span style="width:4px;height:4px;border-radius:999px;background:var(--border-2)"></span></span>
      </div>
      <div style="padding:16px;min-height:140px;display:flex;flex-direction:column;gap:8px;justify-content:flex-end">
        <div style="align-self:flex-start;max-width:75%;padding:8px 12px;border-radius:16px;background:rgba(255,255,255,.04);border:1px solid var(--border);font-size:13px">Order #2041 · refund?</div>
        <div style="align-self:flex-end;max-width:75%;padding:8px 12px;border-radius:16px;background:linear-gradient(180deg,rgba(232,93,117,.13),rgba(232,93,117,.06));border:1px solid rgba(232,93,117,.4);font-size:13px">Processed. Confirmation sent.</div>
      </div>
    </div>
  </div>
</div></body></html>
