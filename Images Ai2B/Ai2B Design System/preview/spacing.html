<!doctype html><html><head><meta charset="utf-8"><title>Spacing</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="wrap">
  <p class="label-mono" style="margin:0 0 14px">8-based spacing · section padding 6rem mobile / 8rem ≥768</p>
  <div style="display:flex;flex-direction:column;gap:8px">
    <div style="display:flex;align-items:center;gap:12px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted);width:48px">4px</span><span style="display:block;height:10px;width:4px;background:var(--accent)"></span></div>
    <div style="display:flex;align-items:center;gap:12px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted);width:48px">8px</span><span style="display:block;height:10px;width:8px;background:var(--accent)"></span></div>
    <div style="display:flex;align-items:center;gap:12px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted);width:48px">12px</span><span style="display:block;height:10px;width:12px;background:var(--accent)"></span></div>
    <div style="display:flex;align-items:center;gap:12px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted);width:48px">16px</span><span style="display:block;height:10px;width:16px;background:var(--accent)"></span></div>
    <div style="display:flex;align-items:center;gap:12px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted);width:48px">24px</span><span style="display:block;height:10px;width:24px;background:var(--accent)"></span></div>
    <div style="display:flex;align-items:center;gap:12px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted);width:48px">32px</span><span style="display:block;height:10px;width:32px;background:var(--accent)"></span></div>
    <div style="display:flex;align-items:center;gap:12px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted);width:48px">48px</span><span style="display:block;height:10px;width:48px;background:var(--accent)"></span></div>
    <div style="display:flex;align-items:center;gap:12px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted);width:48px">64px</span><span style="display:block;height:10px;width:64px;background:var(--accent)"></span></div>
    <div style="display:flex;align-items:center;gap:12px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted);width:48px">96px</span><span style="display:block;height:10px;width:96px;background:var(--accent)"></span></div>
    <div style="display:flex;align-items:center;gap:12px"><span style="font-family:var(--font-mono);font-size:11px;color:var(--muted);width:48px">128px</span><span style="display:block;height:10px;width:128px;background:var(--accent)"></span></div>
  </div>
</div></body></html>
