<!doctype html><html><head><meta charset="utf-8"><title>Agent hues</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="wrap">
  <p class="label-mono" style="margin:0 0 12px">Used only inside an agent's own card</p>
  <div class="stack">
    <div class="swatch"><div class="chip" style="background:#FF5A1F"></div><div class="meta"><div class="name">Sales agent</div><div class="hex">#FF5A1F</div></div><div class="var">--agent-sales</div></div>
    <div class="swatch"><div class="chip" style="background:#E85D75"></div><div class="meta"><div class="name">Support agent</div><div class="hex">#E85D75</div></div><div class="var">--agent-support</div></div>
    <div class="swatch"><div class="chip" style="background:#FFB84D"></div><div class="meta"><div class="name">Operations agent</div><div class="hex">#FFB84D</div></div><div class="var">--agent-ops</div></div>
    <div class="swatch"><div class="chip" style="background:#6EA8FE"></div><div class="meta"><div class="name">Research agent</div><div class="hex">#6EA8FE</div></div><div class="var">--agent-research</div></div>
  </div>
</div></body></html>
