<!doctype html><html><head><meta charset="utf-8"><title>Industry pills</title><link rel="stylesheet" href="_card.css"></head>
<body><div class="wrap">
  <p class="label-mono" style="margin:0 0 12px">Industry pill · highlight variant · protection gradient</p>
  <div style="position:relative">
    <div style="position:absolute;left:0;top:0;bottom:0;width:40px;background:linear-gradient(to right,var(--bg),transparent);z-index:2;pointer-events:none"></div>
    <div style="position:absolute;right:0;top:0;bottom:0;width:40px;background:linear-gradient(to left,var(--bg),transparent);z-index:2;pointer-events:none"></div>
    <div style="display:flex;gap:10px;overflow:hidden;padding:6px 24px">
      <span style="padding:10px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:14px;font-weight:500;white-space:nowrap">Restaurants &amp; Hospitality</span>
      <span style="padding:10px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:14px;font-weight:500;white-space:nowrap">Legal</span>
      <span style="padding:10px 16px;border-radius:999px;background:var(--accent-wash);border:1px solid rgba(255,90,31,.3);color:var(--accent);font-size:14px;font-weight:500;white-space:nowrap">HR &amp; Recruitment</span>
      <span style="padding:10px 16px;border-radius:999px;background:var(--surface);border:1px solid var(--border);color:var(--text);font-size:14px;font-weight:500;white-space:nowrap">Finance</span>
    </div>
  </div>
</div></body></html>
